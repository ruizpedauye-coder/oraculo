<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Oráculo y Orientación</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --border-color: #334155;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            min-height: 600px;
        }

        .view {
            display: none;
            padding: 24px;
            flex-direction: column;
            flex-grow: 1;
            box-sizing: border-box;
            animation: fadeIn 0.3s ease-in-out;
        }

        .view.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Selector de Idiomas */
        .language-selector {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 16px;
        }

        .flag-btn {
            background: transparent;
            border: 2px solid transparent;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 2px;
            transition: transform 0.2s;
        }

        .flag-btn.active {
            border-color: var(--accent-color);
            transform: scale(1.1);
        }

        /* Estilos Portada */
        .portada-content {
            text-align: center;
            margin: auto 0;
        }

        .portada-content h1 {
            font-size: 1.8rem;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .portada-content p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        /* Botones generales */
        .btn-primary {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-back {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.9rem;
            align-self: flex-start;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-back:hover {
            color: var(--text-primary);
        }

        /* Listas de Opciones y Barajas */
        h2 {
            font-size: 1.3rem;
            margin-top: 0;
            margin-bottom: 16px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            max-height: 420px;
            padding-right: 4px;
        }

        .option-button {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 14px 16px;
            border-radius: 10px;
            color: var(--text-primary);
            text-align: left;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .option-button:hover {
            background-color: rgba(99, 102, 241, 0.1);
            border-color: var(--accent-color);
        }

        .option-button .arrow {
            color: var(--text-secondary);
        }

        /* Vista de Resultados */
        .result-card {
            background-color: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .result-card h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--accent-color);
            margin: 0 0 6px 0;
            letter-spacing: 0.5px;
        }

        .result-card p {
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.4;
            color: var(--text-primary);
        }

        /* Reproductor y Subtítulos */
        .audio-container {
            margin-top: auto;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        audio {
            width: 100%;
            height: 36px;
            margin-bottom: 8px;
        }

        .subtitle-box {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-align: center;
            min-height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- VISTA 1: PORTADA -->
        <div id="view-portada" class="view active">
            <div class="language-selector">
                <button class="flag-btn active" onclick="cambiarIdioma('es', event)">🇪🇸</button>
                <button class="flag-btn" onclick="cambiarIdioma('en', event)">🇬🇧</button>
            </div>
            <div class="portada-content">
                <h1 data-i18n="titulo_portada">Oráculo Interior</h1>
                <p data-i18n="desc_portada">Encuentra guía, claridad y comprensión a través de la lectura consciente y la introspección profunda.</p>
                <button class="btn-primary" onclick="entrarDesdePortada()" data-i18n="btn_comenzar">Comenzar Consulta</button>
            </div>
        </div>

        <!-- VISTA 2: SELECCIÓN DE BARAJA / CATEGORÍA -->
        <div id="view-deck" class="view">
            <button class="btn-back" onclick="cambiarVista('view-portada')">&larr; <span data-i18n="volver">Volver</span></button>
            <h2 data-i18n="selecciona_baraja">Selecciona una categoría</h2>
            <div class="options-list">
                <button class="option-button" onclick="seleccionarBaraja('bloqueos')">
                    <span class="title" data-i18n="cat_bloqueos">Bloqueos Emocionales</span>
                    <span class="arrow">&rarr;</span>
                </button>
                <button class="option-button" onclick="seleccionarBaraja('proposito')">
                    <span class="title" data-i18n="cat_proposito">Propósito de Vida</span>
                    <span class="arrow">&rarr;</span>
                </button>
            </div>
        </div>

        <!-- VISTA 3: OPCIONES ESPECÍFICAS DE LA BARAJA -->
        <div id="view-options" class="view">
            <button class="btn-back" onclick="cambiarVista('view-deck')">&larr; <span data-i18n="volver">Volver</span></button>
            <h2 id="active-deck-label">Opciones</h2>
            <div id="options-list" class="options-list">
                <!-- Se llena dinámicamente con JavaScript -->
            </div>
        </div>

        <!-- VISTA 4: RESULTADO Y AUDIO -->
        <div id="view-result" class="view">
            <button class="btn-back" onclick="cambiarVista('view-options')">&larr; <span data-i18n="volver">Volver a opciones</span></button>
            
            <div class="result-card">
                <h3 data-i18n="lbl_friccion">Fricción o Bloqueo</h3>
                <p id="res-friccion">-</p>
            </div>

            <div class="result-card">
                <h3 data-i18n="lbl_nudo">Nudo a Resolver</h3>
                <p id="res-nudo">-</p>
            </div>

            <div class="result-card">
                <h3 data-i18n="lbl_accion">Acción Consciencia</h3>
                <p id="res-accion">-</p>
            </div>

            <!-- Contenedor del Reproductor de Audio y Subtítulos Dinámicos -->
            <div class="audio-container">
                <audio id="audio-element" controls>
                    <source id="audio-source" src="" type="audio/mpeg">
                    Tu navegador no soporta elementos de audio.
                </audio>
                <div id="subtitle-box" class="subtitle-box">
                    <span>Pulsa play para escuchar el mensaje...</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- 1. DICCIONARIO DE TRADUCCIONES ESTÁTICAS ---
        const traducciones = {
            es: {
                titulo_portada: "Oráculo Interior",
                desc_portada: "Encuentra guía, claridad y comprensión a través de la lectura consciente y la introspección profunda.",
                btn_comenzar: "Comenzar Consulta",
                volver: "Volver",
                selecciona_baraja: "Selecciona una categoría",
                cat_bloqueos: "Bloqueos Emocionales",
                cat_proposito: "Propósito de Vida",
                lbl_friccion: "Fricción o Bloqueo",
                lbl_nudo: "Nudo a Resolver",
                lbl_accion: "Acción Consciencia",
                sub_espera: "Pulsa play para escuchar el mensaje..."
            },
            en: {
                titulo_portada: "Inner Oracle",
                desc_portada: "Find guidance, clarity, and understanding through conscious reading and deep introspection.",
                btn_comenzar: "Start Consultation",
                volver: "Back",
                selecciona_baraja: "Select a category",
                cat_bloqueos: "Emotional Blockages",
                cat_proposito: "Life Purpose",
                lbl_friccion: "Friction or Blockage",
                lbl_nudo: "Knot to Resolve",
                lbl_accion: "Conscious Action",
                sub_espera: "Press play to listen to the message..."
            }
        };

        const nombresBarajas = {
            bloqueos: { es: "Bloqueos Emocionales", en: "Emotional Blockages" },
            proposito: { es: "Propósito de Vida", en: "Life Purpose" }
        };

        // --- 2. BASE DE DATOS DE CONTENIDO (CON AUDIO Y SUBTÍTULOS SINCRONIZADOS) ---
        // Los tiempos (tiempo: segundos) marcan en qué momento exacto del audio aparece cada frase.
        const baseDeDatos = {
            bloqueos: [
                {
                    texto: { es: "Miedo al rechazo o juicio ajeno", en: "Fear of rejection or external judgment" },
                    friccion: { es: "Te retienes de expresar tu verdadera opinión por complacer.", en: "You hold back your true opinion to please others." },
                    nudo: { es: "Confundes el amor de los demás con la validación constante.", en: "You confuse love with constant validation." },
                    accion: { es: "Di 'no' a una pequeña exigencia externa hoy sin dar explicaciones.", en: "Say 'no' to a small external demand today without explanations." },
                    audio: "audios/bloqueo_1.mp3",
                    subtitulos: [
                        { tiempo: 0.0, texto: "Analicemos este bloqueo..." },
                        { tiempo: 3.5, texto: "Estás conteniéndote por buscar aprobación externa." },
                        { tiempo: 8.0, texto: "Es momento de priorizar tu propia voz interior." }
                    ]
                },
                {
                    texto: { es: "Resistencia al cambio y apego al control", en: "Resistance to change and attachment to control" },
                    friccion: { es: "Intentas planificar cada detalle sufriendo imprevistos.", en: "You try to plan every detail, suffering when things shift." },
                    nudo: { es: "Miedo profundo a la incertidumbre del futuro.", en: "Deep fear of the uncertainty of the future." },
                    accion: { es: "Suelta una expectativa rígida que tengas para esta semana.", en: "Let go of a rigid expectation you hold for this week." },
                    audio: "audios/bloqueo_2.mp3",
                    subtitulos: [
                        { tiempo: 0.0, texto: "El control excesivo genera agotamiento." },
                        { tiempo: 4.0, texto: "Permítete fluir con lo que la vida te presenta." }
                    ]
                }
            ],
            proposito: [
                {
                    texto: { es: "Alineación de talentos ocultos", en: "Alignment of hidden talents" },
                    friccion: { es: "Realizas tareas que apagan tu energía creativa.", en: "You perform tasks that drain your creative energy." },
                    nudo: { es: "Desconexión entre lo que haces por obligación y tu vocación.", en: "Disconnection between duty and your true calling." },
                    accion: { es: "Dedica 20 minutos hoy a una actividad que te apasione sin buscar frutos económicos.", en: "Spend 20 minutes today on a passion project without monetary goals." },
                    audio: "audios/proposito_1.mp3",
                    subtitulos: [
                        { tiempo: 0.0, texto: "Tu propósito vive donde descansa tu entusiasmo." },
                        { tiempo: 5.0, texto: "Vuelve a conectar con aquello que te hace perder la noción del tiempo." }
                    ]
                }
            ]
        };

        // --- 3. ESTADO DE LA APLICACIÓN ---
        let idiomaActual = 'es';
        let estadoActual = {
            categoria: '',
            baraja: ''
        };
        let subtitulosActuales = [];

        // --- 4. FUNCIONES DE NAVEGACIÓN ENTRE VISTAS ---
        function cambiarVista(idVista) {
            document.querySelectorAll('.view').forEach(view => {
                view.classList.remove('active');
            });
            document.getElementById(idVista).classList.add('active');
            
            // Pausar audio al cambiar de vista si salimos de resultados
            if (idVista !== 'view-result') {
                const audio = document.getElementById('audio-element');
                audio.pause();
            }
        }

        function entrarDesdePortada() {
            cambiarVista('view-deck');
        }

        function cambiarBaraja(barajaKey) {
            estadoActual.baraja = barajaKey;
            
            // Actualizar etiqueta superior
            const label = document.getElementById('active-deck-label');
            label.textContent = nombresBarajas[barajaKey][idiomaActual];

            // Rellenar lista de opciones dinámicamente
            const listContainer = document.getElementById('options-list');
            listContainer.innerHTML = '';

            const items = baseDeDatos[barajaKey] || [];
            
            items.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-button';
                const textoOpcion = item.texto[idiomaActual] || item.texto['es'];
                btn.innerHTML = `<span class="title">${textoOpcion}</span><span class="arrow">&rarr;</span>`;
                btn.onclick = () => mostrarResultado(barajaKey, index);
                listContainer.appendChild(btn);
            });

            cambiarVista('view-options');
        }

        // Mantenemos compatibilidad con el evento onclick del HTML original
        function seleccionarBaraja(barajaKey) {
            estadoActual.categoria = barajaKey;
            cambiarBaraja(barajaKey);
        }

        // --- 5. MOSTRAR RESULTADOS Y CARGAR AUDIO/SUBTÍTULOS ---
        function mostrarResultado(categoria, index) {
            const item = baseDeDatos[categoria][index];

            // Cargar textos en pantalla
            document.getElementById('res-friccion').textContent = item.friccion[idiomaActual] || item.friccion['es'];
            document.getElementById('res-nudo').textContent = item.nudo[idiomaActual] || item.nudo['es'];
            document.getElementById('res-accion').textContent = item.accion[idiomaActual] || item.accion['es'];

            // Configurar reproductor de audio
            const audioElement = document.getElementById('audio-element');
            const audioSource = document.getElementById('audio-source');
            
            audioSource.src = item.audio;
            subtitulosActuales = item.subtitulos || [];
            
            const subtitleBox = document.getElementById('subtitle-box');
            const textoEspera = traducciones[idiomaActual].sub_espera;
            subtitleBox.innerHTML = `<span>${textoEspera}</span>`;

            audioElement.load();
            cambiarVista('view-result');
        }

        // --- 6. SINCRONIZACIÓN DE SUBTÍTULOS EN TIEMPO REAL ---
        document.addEventListener('DOMContentLoaded', () => {
            const audioElement = document.getElementById('audio-element');
            const subtitleBox = document.getElementById('subtitle-box');

            if (audioElement) {
                audioElement.addEventListener('timeupdate', () => {
                    if (!subtitulosActuales || subtitulosActuales.length === 0) return;
                    
                    const tiempoActual = audioElement.currentTime;
                    let textoActivo = "";

                    // Recorre los subtítulos y selecciona el que corresponde al segundo actual
                    for (let i = 0; i < subtitulosActuales.length; i++) {
                        if (tiempoActual >= subtitulosActuales[i].tiempo) {
                            textoActivo = subtitulosActuales[i].texto;
                        }
                    }

                    if (textoActivo) {
                        subtitleBox.innerHTML = `<span>${textoActivo}</span>`;
                    }
                });
            }
        });

        // --- 7. CAMBIO DE IDIOMA DINÁMICO ---
        function cambiarIdioma(lang, event) {
            idiomaActual = lang;
            
            // Actualizar estilo visual de banderas
            document.querySelectorAll('.flag-btn').forEach(btn => btn.classList.remove('active'));
            if (event && event.currentTarget) {
                event.currentTarget.classList.add('active');
            }

            // Traducir elementos fijos con atributo data-i18n
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (traducciones[lang] && traducciones[lang][key]) {
                    el.textContent = traducciones[lang][key];
                }
            });

            // Si está en la vista de barajas, actualizar el título superior dinámicamente
            if (estadoActual.baraja && nombresBarajas[estadoActual.baraja]) {
                const label = document.getElementById('active-deck-label');
                label.textContent = nombresBarajas[estadoActual.baraja][idiomaActual];
            }
        }
    </script>
</body>
</html>
